<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Store Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --surface: #1E1E1E;
      --primary: #25D366;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --danger: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
      font-size: 16px;
      transition: font-size 0.2s;
    }

    body.text-small { font-size: 14px; }
    body.text-large { font-size: 18px; }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
      position: relative;
    }

    /* Mode Toggles */
    .mode-buyer .owner-only {
      display: none !important;
    }
    body:not(.mode-buyer) .buyer-only {
      display: none !important;
    }

    /* Header */
    header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #333;
    }

    .store-name-container {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .store-name {
      font-weight: 600;
      font-size: 1.2em;
      outline: none;
      min-width: 50px;
    }

    .store-name:focus, .hero-title:focus, .hero-desc:focus, .product-name:focus {
      border-bottom: 1px dashed #fff;
      background: rgba(255,255,255,0.1);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9em;
      transition: opacity 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active { opacity: 0.8; }

    .btn-wa { background: var(--primary); color: #fff; text-decoration: none; }
    .btn-outline { background: transparent; border: 1px solid var(--text); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }

    .edit-icon {
      font-size: 0.8em;
      cursor: pointer;
      opacity: 0.7;
      user-select: none;
    }

    /* Owner Settings Panel */
    .owner-panel {
      background: #2a2a2a;
      padding: 15px 20px;
      border-bottom: 1px solid #444;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.9em;
    }

    .input-group input {
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      width: 120px;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 220px;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hero-title {
      font-size: 1.8em;
      font-weight: 700;
      margin: 0;
      outline: none;
    }

    .hero-desc {
      font-size: 1em;
      margin: 0;
      outline: none;
      color: #eee;
      max-width: 90%;
    }

    .hero-bg-upload {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85em;
      cursor: pointer;
      border: 1px solid #fff;
    }

    /* Product Grid */
    .products-container {
      padding: 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product-card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #333;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-weight: 600;
      font-size: 1em;
      margin-bottom: 5px;
      outline: none;
      line-height: 1.3;
    }

    .product-price-wrapper {
      margin-bottom: 5px;
    }

    .product-price {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1em;
    }

    .product-discount {
      font-size: 0.8em;
      color: var(--danger);
      text-decoration: line-through;
      margin-left: 6px;
    }

    .product-modal {
      font-size: 0.85em;
      color: #ffaa00;
      margin-top: 5px;
      background: rgba(255,170,0,0.1);
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .product-actions {
      margin-top: auto;
      padding-top: 12px;
    }

    .product-actions .btn {
      width: 100%;
      padding: 10px;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      font-weight: bold;
      z-index: 5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      cursor: pointer;
      z-index: 1000;
      border: none;
    }

    /* Modal Add Product */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      font-size: 1em;
    }

    .image-preview {
      width: 100%;
      height: 180px;
      background: #111;
      border: 2px dashed #666;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      color: var(--text-muted);
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .image-preview.has-img img {
      display: block;
    }
    .image-preview.has-img span {
      display: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }
  </style>
</head>
<body class="mode-buyer">

<div class="container">

  <header>
    <div class="store-name-container">
      <div class="store-name" id="storeName" contenteditable="false">Toko Saya</div>
      <span class="owner-only edit-icon" title="Edit text">✏️</span>
    </div>

    <div class="header-actions">
      <select id="textSize" class="owner-only" style="background:#111;color:#fff;border:1px solid #444;border-radius:4px;padding:6px;font-size:0.9em;">
        <option value="small">Kecil</option>
        <option value="normal" selected>Sedang</option>
        <option value="large">Besar</option>
      </select>

      <a id="headerWaBtn" href="#" target="_blank" class="btn btn-wa" style="padding: 6px 10px; font-size: 0.85em;">Chat WA</a>
      <button class="btn btn-outline buyer-only" onclick="loginOwner()">Masuk Mode Edit</button>
      <button class="btn btn-outline owner-only" onclick="logoutOwner()" style="border-color: var(--primary); color: var(--primary);">Mode Pembeli / LIVE</button>
    </div>
  </header>

  <div class="owner-panel owner-only">
    <div class="input-group">
      <label>No. WA Owner</label>
      <input type="text" id="waNumber" placeholder="628..." oninput="saveAndRender()">
    </div>
    <div class="input-group">
      <label>Markup Harga (%)</label>
      <input type="number" id="globalMarkup" value="30" oninput="saveAndRender()">
    </div>
    <div style="font-size:0.8em;color:var(--text-muted);width:100%;">
      Info: Harga Jual = Harga Modal + Markup(%) - Diskon
    </div>
  </div>

  <section class="hero" id="heroSection" style="background-image: url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=600&q=80');">
    <div class="hero-overlay"></div>
    <div class="hero-bg-upload owner-only" onclick="document.getElementById('heroBgInput').click()">Ubah Background</div>
    <input type="file" id="heroBgInput" style="display:none" accept="image/*" onchange="handleHeroBg(event)">

    <div class="hero-content">
      <div class="store-name-container" style="justify-content:center;">
        <h1 class="hero-title" id="heroTitle" contenteditable="false">Koleksi Spesial</h1>
        <span class="owner-only edit-icon">✏️</span>
      </div>
      <div class="store-name-container" style="justify-content:center;">
        <p class="hero-desc" id="heroDesc" contenteditable="false">Temukan produk terbaik dengan harga yang pas di kantong.</p>
        <span class="owner-only edit-icon">✏️</span>
      </div>
    </div>
  </section>

  <section class="products-container">
    <div class="products-grid" id="productsGrid">
      <!-- Products generated by JS -->
    </div>
  </section>

  <button class="fab owner-only" onclick="openAddModal()">+</button>

</div>

<!-- Modal Tambah Produk -->
<div class="modal-overlay" id="productModal">
  <div class="modal-content">
    <h3 style="margin:0;">Tambah Produk</h3>

    <div class="image-preview" id="imgPreview" onclick="document.getElementById('prodImgInput').click()">
      <span>Klik untuk Upload Gambar WebP</span>
      <img id="previewImgEl" src="">
    </div>
    <input type="file" id="prodImgInput" style="display:none" accept="image/*" onchange="handleProductImg(event)">

    <input type="text" id="prodName" placeholder="Nama Produk">
    <input type="number" id="prodBasePrice" placeholder="Harga Modal (Rp)">
    <input type="number" id="prodDiscount" placeholder="Diskon (Rp) - Opsional" value="0">

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddModal()">Batal</button>
      <button class="btn btn-wa" onclick="saveProduct()">Simpan Produk</button>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------
  // SISTEM LISENSI (DEV MODE)
  // ---------------------------------------------------
  const DEV_MODE = true;
  if (!DEV_MODE) {
    console.log("Memvalidasi lisensi ke server...");
  } else {
    console.log("Lisensi Pro Aktif: DEV_MODE = true");
  }

  // ---------------------------------------------------
  // SISTEM LOGIN (PIN)
  // ---------------------------------------------------
  const OWNER_PIN = "1234";

  // ---------------------------------------------------
  // STATE MANAGEMENT
  // ---------------------------------------------------
  let storeData = {
    name: "Toko Saya",
    textSize: "normal",
    markup: 30,
    waNumber: "628123456789",
    heroBg: "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=600&q=80",
    heroTitle: "Koleksi Spesial",
    heroDesc: "Temukan produk terbaik dengan harga yang pas di kantong.",
    products: []
  };

  let tempBase64Img = "";

  const body = document.body;
  const storeNameEl = document.getElementById('storeName');
  const textSizeEl = document.getElementById('textSize');
  const globalMarkupEl = document.getElementById('globalMarkup');
  const waNumberEl = document.getElementById('waNumber');
  const heroSection = document.getElementById('heroSection');
  const heroTitleEl = document.getElementById('heroTitle');
  const heroDescEl = document.getElementById('heroDesc');
  const productsGrid = document.getElementById('productsGrid');

  function init() {
    loadData();
    checkMode();
    setupListeners();
    render();
  }

  function loadData() {
    const saved = localStorage.getItem('storeData_v1');
    if (saved) {
      storeData = { ...storeData, ...JSON.parse(saved) };
    }
  }

  function saveData() {
    localStorage.setItem('storeData_v1', JSON.stringify(storeData));
  }

  // ---------------------------------------------------
  // MODE: BUYER & OWNER
  // ---------------------------------------------------
  function checkMode() {
    const mode = localStorage.getItem('storeMode') || 'buyer';
    if (mode === 'owner') {
      body.classList.remove('mode-buyer');
      makeEditable(true);
    } else {
      body.classList.add('mode-buyer');
      makeEditable(false);
    }
  }

  function makeEditable(isEditable) {
    storeNameEl.contentEditable = isEditable;
    heroTitleEl.contentEditable = isEditable;
    heroDescEl.contentEditable = isEditable;
  }

  function loginOwner() {
    const pin = prompt("Masukkan PIN Owner:");
    if (pin === OWNER_PIN) {
      localStorage.setItem('storeMode', 'owner');
      checkMode();
      render();
    } else if (pin !== null) {
      alert("PIN Salah! Akses ditolak.");
    }
  }

  function logoutOwner() {
    localStorage.setItem('storeMode', 'buyer');
    checkMode();
    render();
  }

  // ---------------------------------------------------
  // LIVE EDIT EVENTS
  // ---------------------------------------------------
  function setupListeners() {
    const editableElements = [storeNameEl, heroTitleEl, heroDescEl];
    editableElements.forEach(el => {
      el.addEventListener('input', () => {
        storeData.name = storeNameEl.innerText;
        storeData.heroTitle = heroTitleEl.innerText;
        storeData.heroDesc = heroDescEl.innerText;
        saveData();
      });
    });

    textSizeEl.addEventListener('change', (e) => {
      storeData.textSize = e.target.value;
      saveData();
      applyTextSize();
    });
  }

  function applyTextSize() {
    body.classList.remove('text-small', 'text-large');
    if (storeData.textSize === 'small') body.classList.add('text-small');
    if (storeData.textSize === 'large') body.classList.add('text-large');
    textSizeEl.value = storeData.textSize;
  }

  // ---------------------------------------------------
  // RENDER UI
  // ---------------------------------------------------
  function render() {
    storeNameEl.innerText = storeData.name;
    globalMarkupEl.value = storeData.markup;
    waNumberEl.value = storeData.waNumber;
    heroSection.style.backgroundImage = `url('${storeData.heroBg}')`;
    heroTitleEl.innerText = storeData.heroTitle;
    heroDescEl.innerText = storeData.heroDesc;
    applyTextSize();

    // Global Header WA Button
    const headerWaLink = `https://wa.me/${storeData.waNumber}?text=${encodeURIComponent("Halo, saya ingin bertanya tentang produk di toko Anda.")}`;
    document.getElementById('headerWaBtn').href = headerWaLink;

    productsGrid.innerHTML = "";
    storeData.products.forEach((p, index) => {
      const basePrice = Number(p.basePrice) || 0;
      const discount = Number(p.discount) || 0;
      const markupPercent = Number(storeData.markup) || 0;

      const salePrice = Math.round(basePrice * (1 + markupPercent / 100)) - discount;
      const originalPrice = salePrice + discount;

      const formatRp = (num) => "Rp " + num.toLocaleString('id-ID');

      const waText = encodeURIComponent(`Halo, saya tertarik dengan ${p.name} harga ${formatRp(salePrice)}`);
      const waLink = `https://wa.me/${storeData.waNumber}?text=${waText}`;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <button class="delete-btn owner-only" onclick="deleteProduct(${index})" title="Hapus Produk">×</button>
        <img class="product-img" src="${p.image}" alt="${p.name}">
        <div class="product-info">
          <div class="store-name-container" style="margin-bottom:5px;">
            <div class="product-name" ${body.classList.contains('mode-buyer') ? '' : 'contenteditable="true" onblur="updateProductName('+index+', this.innerText)"'}>${p.name}</div>
            <span class="owner-only edit-icon">✏️</span>
          </div>

          <div class="product-price-wrapper">
            <span class="product-price">${formatRp(salePrice)}</span>
            ${discount > 0 ? `<span class="product-discount">${formatRp(originalPrice)}</span>` : ''}
          </div>

          <div class="product-modal owner-only">Harga Modal: <br> ${formatRp(basePrice)}</div>

          <div class="product-actions">
            <a href="${waLink}" target="_blank" class="btn btn-wa">Beli via WA</a>
          </div>
        </div>
      `;
      productsGrid.appendChild(card);
    });
  }

  function saveAndRender() {
    storeData.markup = Number(globalMarkupEl.value);
    storeData.waNumber = waNumberEl.value;
    saveData();
    render();
  }

  window.updateProductName = function(index, newName) {
    storeData.products[index].name = newName;
    saveData();
  }

  function deleteProduct(index) {
    if(confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
      storeData.products.splice(index, 1);
      saveData();
      render();
    }
  }

  // ---------------------------------------------------
  // AUTO COMPRESS GAMBAR WEBP (Canvas API)
  // ---------------------------------------------------
  async function compressImage(file, targetMinKB = 20, targetMaxKB = 100) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > 800) {
            height = Math.round((height * 800) / width);
            width = 800;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.9;
          let resultBase64 = canvas.toDataURL('image/webp', quality);

          let sizeKB = (resultBase64.length * 0.75) / 1024;

          while (sizeKB > targetMaxKB && quality > 0.1) {
            quality -= 0.1;
            resultBase64 = canvas.toDataURL('image/webp', quality);
            sizeKB = (resultBase64.length * 0.75) / 1024;
          }

          resolve(resultBase64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleHeroBg(e) {
    const file = e.target.files[0];
    if(!file) return;
    document.querySelector('.hero-bg-upload').innerText = 'Mengunggah...';
    const base64 = await compressImage(file);
    storeData.heroBg = base64;
    saveData();
    render();
    document.querySelector('.hero-bg-upload').innerText = 'Ubah Background';
  }

  async function handleProductImg(e) {
    const file = e.target.files[0];
    if(!file) return;
    const previewEl = document.getElementById('imgPreview');
    previewEl.innerHTML = '<span>Mengompres Gambar...</span>';

    tempBase64Img = await compressImage(file);

    previewEl.classList.add('has-img');
    previewEl.innerHTML = `<img id="previewImgEl" src="${tempBase64Img}">`;
  }

  // ---------------------------------------------------
  // MODAL LOGIC
  // ---------------------------------------------------
  function openAddModal() {
    document.getElementById('productModal').classList.add('active');
    document.getElementById('prodName').value = '';
    document.getElementById('prodBasePrice').value = '';
    document.getElementById('prodDiscount').value = '0';
    document.getElementById('prodImgInput').value = '';
    tempBase64Img = '';
    const preview = document.getElementById('imgPreview');
    preview.classList.remove('has-img');
    preview.innerHTML = `<span>Klik untuk Upload Gambar WebP</span><img id="previewImgEl" src="">`;
  }

  function closeAddModal() {
    document.getElementById('productModal').classList.remove('active');
  }

  function saveProduct() {
    const name = document.getElementById('prodName').value;
    const basePrice = document.getElementById('prodBasePrice').value;
    const discount = document.getElementById('prodDiscount').value;

    if (!name || !basePrice || !tempBase64Img) {
      alert("Nama, harga modal, dan gambar wajib diisi!");
      return;
    }

    storeData.products.push({
      name,
      basePrice: Number(basePrice),
      discount: Number(discount),
      image: tempBase64Img
    });

    saveData();
    render();
    closeAddModal();
  }

  // RUN APP
  init();
</script>

</body>
</html>
